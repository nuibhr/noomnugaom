[project]
name = "noomnugaom-stock-analyst-api"
version = "0.1.0"
description = "Free-data-first FastAPI backend for a stock-analysis chatbot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "yfinance>=0.2.54,<1.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
